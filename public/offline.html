<!doctype html>
<html lang="ja" data-theme="darkblue">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>オフライン — 十字架_mania</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #060a15;
        color: #e9eefb;
        font-family: "Yu Gothic UI", Meiryo, system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
      }
      .card {
        border: 1px solid #1d2c4a;
        background: #0c1425;
        border-radius: 16px;
        padding: 2.5rem 2rem;
        max-width: 30rem;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
      p { color: #93a4c4; line-height: 1.8; margin: 0.5rem 0 0; font-size: 0.9rem; }
      a { color: #7dd3fc; }
      .cross { font-size: 2.5rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="cross">✚</div>
      <h1>オフラインです</h1>
      <p>ネットワークに接続できませんでした。自宅鯖がお休みしているか、回線が落ちているかもしれません。</p>
      <p>接続が戻ったら <a href="/">トップページ</a> を再読み込みしてください。</p>
    </div>
  </body>
</html>
